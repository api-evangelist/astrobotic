aid: astrobotic
name: Astrobotic
description: 'Astrobotic Technology is a Pittsburgh-based space robotics company building
  lunar landers, rovers, and lunar surface infrastructure for NASA and commercial customers.
  Its product lines include the Peregrine and Griffin lunar landers, the CubeRover and
  Polaris rover families, LunaGrid lunar surface power, the Xodiac reusable suborbital
  rocket lander test platform, and spacecraft navigation, machine vision and computing
  systems. The company sells payload delivery to the Moon under NASA''s Commercial Lunar
  Payload Services (CLPS) program, alongside the consumer MoonBox service. Voyager
  Technologies completed its acquisition of Astrobotic on 13 July 2026 and the business
  now operates as Voyager Lunar Systems from its Pittsburgh headquarters. Astrobotic sells
  missions and hardware, not software: it publishes no public API, developer portal, SDK,
  or machine-readable specification.'
